<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Security</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      text-align: center;
    }

    header {
      padding: 50px 20px;
      background: #111827;
    }

    h1 {
      color: #00ff88;
      font-size: 40px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
    }

    .box {
      margin: 30px auto;
      padding: 25px;
      max-width: 500px;
      background: #151c25;
      border-radius: 15px;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 8px;
      background: #00c878;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #00a866;
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛡️ Cyber Security</h1>
    <p>Learn how to stay safe online.</p>
  </header>

  <div class="box">
    <h2>Stay Protected</h2>
    <p>Use strong passwords, enable two-factor authentication, and avoid suspicious links.</p>
    <button onclick="showMessage()">Security Tip</button>
    <p id="message"></p>
  </div>

  <footer>
    © 2026 My Cybersecurity Website
  </footer>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Tip: Never share your password or verification code with anyone.";
    }
  </script>


</body>
</html>
